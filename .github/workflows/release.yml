name: Release plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*.*'

env:
  PROJECT: AllaganMarket
  INTERNAL_NAME: AllaganMarket-bld
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore ${{ env.PROJECT }}

      - name: Prepare release asset
        shell: pwsh
        run: |
          $source = "${{ env.PROJECT }}\bin\Release\${{ env.INTERNAL_NAME }}\latest.zip"
          if (-not (Test-Path $source)) {
            throw "Dalamud package was not produced: $source"
          }
          Copy-Item $source "${{ env.INTERNAL_NAME }}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ env.INTERNAL_NAME }}.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
